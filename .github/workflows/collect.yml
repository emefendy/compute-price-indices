# Collects a price snapshot every day and commits it back to the repo
# ("git scraping"), so the git history itself becomes the dataset's audit trail.
#
# Azure needs no credentials. AWS and GCP are skipped unless you add secrets:
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  (any IAM user with pricing:GetProducts)
#   GCP_API_KEY                                (a key with the Cloud Billing API enabled)
name: collect

on:
  schedule:
    - cron: "17 13 * * *"  # daily, 13:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[aws,dev]"

      - name: Test
        run: pytest -q

      - name: Collect, build, validate, report
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GCP_API_KEY: ${{ secrets.GCP_API_KEY }}
        run: |
          providers="azure"
          [ -n "$AWS_ACCESS_KEY_ID" ] && providers="$providers,aws"
          [ -n "$GCP_API_KEY" ] && providers="$providers,gcp"
          gpu-prices run --providers "$providers"

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "Snapshot $(date -u +%Y-%m-%d)"
          git push
