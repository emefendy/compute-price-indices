[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-prices"
version = "0.1.0"
description = "Daily snapshots of public cloud GPU prices, normalized to $/GPU-hour, with data-quality checks and a chained price index."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emilie Efendy" }]
dependencies = [
    "polars>=1.0",
    "requests>=2.31",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
gpu-prices = "gpu_prices.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpu_prices = ["gpu_catalog.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
